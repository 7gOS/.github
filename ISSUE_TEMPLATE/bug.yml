name: Bug
description: 软件问题
title: "[Bug] "
type: Bug
body:
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望 / 实际
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境与版本
  - type: dropdown
    id: severity
    attributes:
      label: severity
      options: [P0, P1, P2, P3]
    validations:
      required: true
